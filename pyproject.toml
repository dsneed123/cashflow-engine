[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cashflow-engine"
version = "0.1.0"
description = "Automated ethical money-making SaaS platform with trading, arbitrage, and subscription revenue streams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.0",
    "fastapi>=0.111",
    "httpx>=0.27",
    "passlib[bcrypt]>=1.7",
    "pydantic>=2.0",
    "python-jose[cryptography]>=3.3",
    "stripe>=7.0",
    "structlog>=24.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
cashflow-engine = "cashflow_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cashflow_engine"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=cashflow_engine --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
